<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Outer C wireframe stroke gradient -->
    <linearGradient id="cStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- S Ribbon Facets Gradients -->
    <!-- Top Horizontal Facet -->
    <linearGradient id="sTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4e1ff" />
      <stop offset="100%" stop-color="#f1f5fe" />
    </linearGradient>

    <!-- Top Diagonal Fold -->
    <linearGradient id="sFoldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#b8ceff" />
    </linearGradient>

    <!-- Left Vertical Stem -->
    <linearGradient id="sStemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0c7ff" />
      <stop offset="100%" stop-color="#8faef5" />
    </linearGradient>

    <!-- Middle Diagonal Fold -->
    <linearGradient id="sFoldMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8faef5" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <!-- Right Vertical Stem -->
    <linearGradient id="sStemRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#a5c2fe" />
    </linearGradient>

    <!-- Bottom Diagonal Fold -->
    <linearGradient id="sFoldBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5c2fe" />
      <stop offset="100%" stop-color="#d4e1ff" />
    </linearGradient>

    <!-- Bottom Horizontal Bar -->
    <linearGradient id="sBotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5d8fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Dark Squircle Container -->
  <rect x="2" y="2" width="252" height="252" rx="54" fill="url(#bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <g transform="translate(64, 32)">
    <!-- 1. Outer C Wireframe Outline (width 128, height 192) -->
    <!-- Top horizontal, top-left chamfer, left vertical, bottom-left chamfer, inner cutout -->
    <path d="M 33 1 L 125 1 L 125 65 L 83 65 L 83 67 L 44 67 L 44 46 L 89 46 L 89 26 L 33 26 L 24 35 L 24 135 L 33 144 L 83 144 L 83 146 L 125 146 L 125 191 L 33 191 L 1 159 L 1 33 Z"
          fill="#000000" stroke="url(#cStroke)" stroke-width="2.2" stroke-linejoin="round" />

    <!-- 2. Inside Origami S Ribbon (faceted polygons) -->
    <!-- Top Horizontal Bar -->
    <polygon points="44,46 89,46 89,67 44,67" fill="url(#sTopGrad)" />

    <!-- Top Diagonal Fold -->
    <polygon points="44,46 44,67 24,87 24,66" fill="url(#sFoldTop)" />

    <!-- Left Vertical Stem -->
    <polygon points="24,66 44,66 44,124 24,124" fill="url(#sStemGrad)" />

    <!-- Middle Diagonal Fold -->
    <polygon points="24,124 44,124 83,144 63,144" fill="url(#sFoldMid)" />

    <!-- Middle / Right Vertical Stem -->
    <polygon points="63,114 83,114 83,168 63,168" fill="url(#sStemRight)" />

    <!-- Bottom Diagonal Fold -->
    <polygon points="63,168 83,168 125,191 105,191" fill="url(#sFoldBot)" />

    <!-- Bottom Horizontal Bar -->
    <polygon points="33,166 125,166 125,191 33,191" fill="url(#sBotGrad)" />
  </g>
</svg>
